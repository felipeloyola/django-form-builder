{# Custom widget template for CustomVideoField. #}

<div class="columns video-upload-container">
  <!-- File input -->
  <div class="column">
    <div class="file is-normal has-name">
      <label class="file-label">
        <input class="file-input" type="file" name="{{ widget.name }}" accept="video/*" {% include "django/forms/widgets/attrs.html" %} />
        <span class="file-cta">
          <span class="file-icon">
            <i class="fas fa-upload"></i>
          </span>
          <span class="file-label"> Seleccionar </span>
        </span>
        <span class="file-name"> {% if widget.is_initial %} {{ widget.value.name }} {% else %} Sin archivo {% endif %}
        </span>
      </label>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="column">
    <div class="field" style="max-width: 340px;">
      <div class="control">
        <progress class="progress is-info progress-bar" id="progressBar" value="0" max="100"
          style="width: 100%; margin-bottom: 0;">0%</progress>
      </div>
      <span id="progressText" class="progress-text" style="font-size: 0.95em;">0%</span>
    </div>
  </div>
</div>
