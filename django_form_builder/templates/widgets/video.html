{# Custom widget template for CustomVideoField. #}

<div class="django-form-builder-video-input" {% if widget.is_initial %}style="margin-top: 0.5rem;" {% endif %}>

  <label {% if widget.attrs.id %}for="{{ widget.attrs.id }}" {% endif %} style="display: block; margin-bottom: 0.5rem;">
    {{ widget.input_text }}:
  </label>

  <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
    <div class="file is-normal has-name">
      <label class="file-label">
        <input class="file-input" type="file" name="{{ widget.name }}" accept="video/*" {% include "django/forms/widgets/attrs.html" %} />
        <span class="file-cta">
          <span class="file-icon">
            <i class="fas fa-upload"></i>
          </span>
          <span class="file-label"> Selecciona un archivo… </span>
        </span>
        <span class="file-name"> {% if widget.is_initial %} {{ widget.value.name }} {% else %} Sin archivo {% endif %} </span>
      </label>
    </div>

    <div class="field" style="max-width: 340px;">
      <div class="control">
        <progress class="progress is-info" id="progressBar" value="0" max="100"
          style="width: 100%; margin-bottom: 0;">0%</progress>
      </div>
      <span id="progressText" style="font-size: 0.95em;">0%</span>
    </div>

  </div>
